version: '3.9'

services:
  app:
    build: .
    container_name: tudunum-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev
    networks:
      - tudunum-network

  postgres:
    image: postgres:16
    container_name: tudunum-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tudunum
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tudunum-network

  redis:
    image: redis:7-alpine
    container_name: tudunum-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - tudunum-network

volumes:
  postgres_data:
  redis_data:

networks:
  tudunum-network:
    driver: bridge
