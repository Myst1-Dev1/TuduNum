<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2740" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9fbcff" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#2a3b5d" stroke-width="4"/>

  <circle cx="360" cy="160" r="55" fill="url(#sunGrad)" filter="url(#neonGlow)" opacity="0.95" />

  <path d="M 140 380 L 220 300 L 320 350" stroke="#2a3b5d" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M 220 300 L 220 180" stroke="#2a3b5d" stroke-width="4" stroke-dasharray="8 8" fill="none" opacity="0.3"/>

  <g filter="url(#neonGlow)">
    <path d="M 130 150 L 290 150" stroke="url(#checkGrad)" stroke-width="32" stroke-linecap="round" />
    
    <path d="M 210 150 L 210 290 L 255 335 L 390 180" 
          stroke="url(#checkGrad)" 
          stroke-width="36" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <circle cx="390" cy="180" r="14" fill="#fbbf24" />
</svg>
